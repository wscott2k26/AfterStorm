name: AfterStorm iOS CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

concurrency:
  group: afterstorm-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift core tests
        run: swift test

  ios-simulator-build:
    name: iPhone simulator build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Generate deterministic app assets
        run: python3 scripts/generate-assets.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build AfterStorm and widget
        run: |
          set -o pipefail
          xcodebuild \
            -project AfterStorm.xcodeproj \
            -scheme AfterStorm \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: afterstorm-xcodebuild-log
          path: xcodebuild.log
