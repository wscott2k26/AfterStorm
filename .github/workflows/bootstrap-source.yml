name: Publish AfterStorm Source

on:
  push:
    branches:
      - feature/afterstorm-core-slice
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: feature/afterstorm-core-slice
          fetch-depth: 0

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          cat .bootstrap/part-* > /tmp/afterstorm-source.tar.gz.b64
          base64 -d /tmp/afterstorm-source.tar.gz.b64 > /tmp/afterstorm-source.tar.gz
          echo "90bdbe2545eebfecc46ddef13d6c88674e008349327bc5cf93fa7b243a8b0d04  /tmp/afterstorm-source.tar.gz" | sha256sum -c -

      - name: Expand release candidate
        shell: bash
        run: |
          tar -xzf /tmp/afterstorm-source.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/ios-ci.yml

      - name: Commit normal source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish AfterStorm V1 release candidate"
          git push origin HEAD:feature/afterstorm-core-slice
