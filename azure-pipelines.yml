trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'macOS-26'

variables:
  derivedDataPath: '$(Build.SourcesDirectory)/DerivedData'

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - bash: |
      set -euo pipefail
      XCODE_APP="$(python3 - <<'PY'
      import pathlib, re
      candidates = []
      for path in pathlib.Path('/Applications').glob('Xcode_26*.app'):
          match = re.search(r'Xcode_(\d+(?:\.\d+)*)', path.name)
          if not match:
              continue
          version = tuple(int(part) for part in match.group(1).split('.'))
          candidates.append((version, str(path)))
      candidates.sort()
      print(candidates[-1][1] if candidates else '')
      PY
      )"
      if [ -z "$XCODE_APP" ]; then
        echo 'No Xcode 26 installation was found on the hosted macOS image.' >&2
        exit 1
      fi
      echo "Using $XCODE_APP"
      sudo xcode-select -s "$XCODE_APP/Contents/Developer"
      xcodebuild -version
      swift --version
    displayName: 'Select newest installed Xcode 26'

  - bash: |
      set -euo pipefail
      swift test
    displayName: 'Run AfterStormCore tests'

  - bash: |
      set -euo pipefail
      python3 scripts/generate-assets.py
    displayName: 'Generate deterministic app assets'

  - bash: |
      set -euo pipefail
      if ! command -v xcodegen >/dev/null 2>&1; then
        brew install xcodegen
      fi
      xcodegen --version
      xcodegen generate
    displayName: 'Generate Xcode project'

  - bash: |
      set -euo pipefail
      test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw AfterStormWidget/Info.plist)" = "com.apple.widgetkit-extension"
    displayName: 'Verify WidgetKit metadata'

  - bash: |
      set -o pipefail
      mkdir -p azure-screens
      : > xcodebuild.log
      xcodebuild \
        -project AfterStorm.xcodeproj \
        -scheme AfterStorm \
        -configuration Debug \
        -sdk iphonesimulator \
        -destination 'generic/platform=iOS Simulator' \
        -derivedDataPath "$(derivedDataPath)" \
        CODE_SIGNING_ALLOWED=NO \
        build | tee xcodebuild.log
    displayName: 'Build AfterStorm and widget for iOS Simulator'

  - bash: |
      set -euo pipefail
      mkdir -p azure-screens
      if [ -f xcodebuild.log ]; then
        grep -nE '(^|[^A-Za-z])(error:|fatal error:)' xcodebuild.log > azure-screens/xcode-errors.txt || true
        tail -n 300 xcodebuild.log > azure-screens/xcodebuild-tail.txt || true
        echo '=== Xcode compiler errors ==='
        if [ -s azure-screens/xcode-errors.txt ]; then
          cat azure-screens/xcode-errors.txt
        else
          echo 'No literal compiler error lines were found; inspect xcodebuild-tail.txt.'
        fi
      else
        echo 'xcodebuild.log was not created.' > azure-screens/xcode-errors.txt
      fi
    displayName: 'Collect Xcode failure diagnostics'
    condition: always()

  - bash: |
      set -euo pipefail
      if grep -n 'warning:' xcodebuild.log; then
        echo 'Xcode build emitted warnings.' >&2
        exit 1
      fi
      echo 'AfterStorm Azure build is warning-clean.'
    displayName: 'Require warning-clean Xcode build'

  - bash: |
      set -euxo pipefail
      mkdir -p azure-screens

      UDID="$(python3 - <<'PY'
      import json, subprocess
      data = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
      candidates = []
      for runtime, devices in data.get('devices', {}).items():
          if 'iOS' not in runtime:
              continue
          for device in devices:
              if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                  candidates.append((runtime, device['name'], device['udid']))
      candidates.sort(reverse=True)
      print(candidates[0][2] if candidates else '')
      PY
      )"

      if [ -z "$UDID" ]; then
        echo 'No available iPhone simulator was found on the Azure macOS image.' >&2
        exit 1
      fi

      echo "Using simulator $UDID"
      xcrun simctl boot "$UDID" || true
      xcrun simctl bootstatus "$UDID" -b

      APP_PATH="$(derivedDataPath)/Build/Products/Debug-iphonesimulator/AfterStorm.app"
      test -d "$APP_PATH"
      test -f "$APP_PATH/PlugIns/AfterStormWidget.appex/Info.plist"
      xcrun simctl install "$UDID" "$APP_PATH"

      xcrun simctl launch "$UDID" com.stormandme.afterstorm | tee azure-screens/smoke-launch.txt
      sleep 4
      xcrun simctl io "$UDID" screenshot azure-screens/afterstorm-smoke.png

      for SCENARIO in first-quest quest-complete restoration main-progress; do
        xcrun simctl terminate "$UDID" com.stormandme.afterstorm || true
        xcrun simctl launch "$UDID" com.stormandme.afterstorm --afterstorm-acceptance "$SCENARIO" \
          | tee "azure-screens/${SCENARIO}-launch.txt"
        sleep 4
        xcrun simctl io "$UDID" screenshot "azure-screens/afterstorm-${SCENARIO}.png"
      done

      xcrun simctl spawn "$UDID" log show --last 5m --style compact \
        --predicate 'process == "AfterStorm" OR eventMessage CONTAINS[c] "com.stormandme.afterstorm"' \
        > azure-screens/afterstorm-runtime.log 2>&1 || true

      if grep -Eq 'RBSProcessExitStatus domain:(metal|crash|watchdog)|termination reported.*com\.stormandme\.afterstorm.*domain:(metal|crash|watchdog)' azure-screens/afterstorm-runtime.log; then
        echo 'AfterStorm terminated unexpectedly during Azure simulator acceptance.' >&2
        cat azure-screens/afterstorm-runtime.log
        exit 1
      fi
    displayName: 'Boot iPhone simulator and capture acceptance screens'
    timeoutInMinutes: 12

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: 'xcodebuild.log'
      ArtifactName: 'afterstorm-xcode-log'
      publishLocation: 'Container'
    displayName: 'Publish Xcode build log'

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: 'azure-screens'
      ArtifactName: 'afterstorm-simulator-screens'
      publishLocation: 'Container'
    displayName: 'Publish AfterStorm simulator screens and diagnostics'
