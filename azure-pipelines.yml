trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'macOS-15'

variables:
  derivedDataPath: '$(Build.SourcesDirectory)/DerivedData'

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - bash: |
      set -euo pipefail
      XCODE_APP='/Applications/Xcode_26.3.app'
      if [ ! -d "$XCODE_APP" ]; then
        echo "Required Xcode not found: $XCODE_APP" >&2
        ls -1 /Applications/Xcode*.app || true
        exit 1
      fi
      sudo xcode-select -s "$XCODE_APP/Contents/Developer"
      echo '=== Host ==='
      sw_vers
      uname -m
      echo '=== Xcode ==='
      xcodebuild -version
      swift --version

      # Runner-images documents this as the workaround for hosted macOS jobs
      # that report simulator connection problems after switching Xcode.
      xcrun simctl list > /dev/null
      echo 'CoreSimulator service initialized.'
    displayName: 'Select Xcode 26.3 and initialize CoreSimulator'

  - bash: |
      set -euo pipefail
      swift test
    displayName: 'Run AfterStormCore tests'

  - bash: |
      set -euo pipefail
      python3 scripts/generate-assets.py
    displayName: 'Generate deterministic app assets'

  - bash: |
      set -euo pipefail
      if ! command -v xcodegen >/dev/null 2>&1; then
        brew install xcodegen
      fi
      xcodegen --version
      xcodegen generate
    displayName: 'Generate Xcode project'

  - bash: |
      set -euo pipefail
      test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw AfterStormWidget/Info.plist)" = "com.apple.widgetkit-extension"
    displayName: 'Verify WidgetKit metadata'

  - bash: |
      set -o pipefail
      mkdir -p azure-screens
      : > xcodebuild.log
      xcodebuild \
        -project AfterStorm.xcodeproj \
        -scheme AfterStorm \
        -configuration Debug \
        -sdk iphonesimulator \
        -destination 'generic/platform=iOS Simulator' \
        -derivedDataPath "$(derivedDataPath)" \
        CODE_SIGNING_ALLOWED=NO \
        build | tee xcodebuild.log
    displayName: 'Build AfterStorm and widget for iOS Simulator'

  - bash: |
      set -euo pipefail
      mkdir -p azure-screens
      if [ -f xcodebuild.log ]; then
        grep -nE '(^|[^A-Za-z])(error:|fatal error:)' xcodebuild.log > azure-screens/xcode-errors.txt || true
        tail -n 300 xcodebuild.log > azure-screens/xcodebuild-tail.txt || true
        echo '=== Xcode compiler errors ==='
        if [ -s azure-screens/xcode-errors.txt ]; then
          cat azure-screens/xcode-errors.txt
        else
          echo 'No literal compiler error lines were found.'
        fi
      else
        echo 'xcodebuild.log was not created.' > azure-screens/xcode-errors.txt
      fi
    displayName: 'Collect Xcode diagnostics'
    condition: always()

  - bash: |
      set -euo pipefail
      if grep -n 'warning:' xcodebuild.log; then
        echo 'Xcode build emitted warnings.' >&2
        exit 1
      fi
      echo 'AfterStorm Azure build is warning-clean.'
    displayName: 'Require warning-clean Xcode build'

  - bash: |
      set -euo pipefail
      mkdir -p azure-screens
      : > azure-screens/simulator-boot.log

      xcrun simctl shutdown all >> azure-screens/simulator-boot.log 2>&1 || true
      xcrun simctl delete unavailable >> azure-screens/simulator-boot.log 2>&1 || true
      xcrun simctl list > /dev/null

      RUNTIME='com.apple.CoreSimulator.SimRuntime.iOS-26-2'
      DEVICE_TYPE='com.apple.CoreSimulator.SimDeviceType.iPhone-17'

      if ! xcrun simctl list runtimes | grep -q 'iOS 26.2'; then
        echo '##vso[task.logissue type=warning]iOS 26.2 simulator runtime is not present on this hosted image. Build/test gate passed; visual evidence skipped.'
        xcrun simctl list runtimes | tee -a azure-screens/simulator-boot.log
        exit 0
      fi

      if ! xcrun simctl list devicetypes | grep -q 'iPhone 17'; then
        echo '##vso[task.logissue type=warning]iPhone 17 simulator device type is not present. Build/test gate passed; visual evidence skipped.'
        xcrun simctl list devicetypes | tee -a azure-screens/simulator-boot.log
        exit 0
      fi

      UDID="$(xcrun simctl create "AfterStorm-CI-$(Build.BuildId)" "$DEVICE_TYPE" "$RUNTIME")"
      echo "Created fresh iPhone 17 simulator: $UDID" | tee -a azure-screens/simulator-boot.log

      cleanup() {
        xcrun simctl shutdown "$UDID" >> azure-screens/simulator-boot.log 2>&1 || true
        xcrun simctl delete "$UDID" >> azure-screens/simulator-boot.log 2>&1 || true
      }
      trap cleanup EXIT

      xcrun simctl boot "$UDID" >> azure-screens/simulator-boot.log 2>&1 || true

      set +e
      UDID="$UDID" python3 - <<'PY'
      import json
      import os
      import subprocess
      import sys
      import time

      udid = os.environ['UDID']
      deadline = time.time() + 180
      while time.time() < deadline:
          result = subprocess.run(
              ['xcrun', 'simctl', 'list', 'devices', '-j'],
              capture_output=True,
              text=True,
          )
          if result.returncode == 0:
              try:
                  payload = json.loads(result.stdout)
              except json.JSONDecodeError:
                  payload = {}
              state = None
              for devices in payload.get('devices', {}).values():
                  for device in devices:
                      if device.get('udid') == udid:
                          state = device.get('state')
                          break
                  if state is not None:
                      break
              if state == 'Booted':
                  ready = subprocess.run(
                      ['xcrun', 'simctl', 'spawn', udid, 'launchctl', 'print', 'system'],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if ready.returncode == 0:
                      print(f'Simulator ready: {udid}')
                      sys.exit(0)
          time.sleep(5)
      print('Simulator did not become ready within 180 seconds.', file=sys.stderr)
      sys.exit(2)
      PY
      BOOT_RESULT=$?
      set -e

      if [ "$BOOT_RESULT" -ne 0 ]; then
        echo '##vso[task.logissue type=warning]Fresh Azure iPhone simulator did not become ready. Build/test gate passed; screenshot evidence skipped.'
        xcrun simctl list devices available | tee -a azure-screens/simulator-boot.log
        exit 0
      fi

      APP_PATH="$(derivedDataPath)/Build/Products/Debug-iphonesimulator/AfterStorm.app"
      test -d "$APP_PATH"
      test -f "$APP_PATH/PlugIns/AfterStormWidget.appex/Info.plist"

      xcrun simctl install "$UDID" "$APP_PATH"
      xcrun simctl launch "$UDID" com.stormandme.afterstorm | tee azure-screens/smoke-launch.txt
      sleep 4
      xcrun simctl io "$UDID" screenshot azure-screens/afterstorm-smoke.png

      for SCENARIO in first-quest quest-complete restoration main-progress; do
        xcrun simctl terminate "$UDID" com.stormandme.afterstorm || true
        xcrun simctl launch "$UDID" com.stormandme.afterstorm --afterstorm-acceptance "$SCENARIO" \
          | tee "azure-screens/${SCENARIO}-launch.txt"
        sleep 4
        xcrun simctl io "$UDID" screenshot "azure-screens/afterstorm-${SCENARIO}.png"
      done

      xcrun simctl spawn "$UDID" log show --last 5m --style compact \
        --predicate 'process == "AfterStorm" OR eventMessage CONTAINS[c] "com.stormandme.afterstorm"' \
        > azure-screens/afterstorm-runtime.log 2>&1 || true

      if grep -Eq 'RBSProcessExitStatus domain:(metal|crash|watchdog)|termination reported.*com\.stormandme\.afterstorm.*domain:(metal|crash|watchdog)' azure-screens/afterstorm-runtime.log; then
        echo 'AfterStorm terminated unexpectedly during simulator acceptance.' >&2
        cat azure-screens/afterstorm-runtime.log
        exit 1
      fi
    displayName: 'Create fresh iPhone 17 and capture acceptance screens'
    timeoutInMinutes: 8

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: 'xcodebuild.log'
      ArtifactName: 'afterstorm-xcode-log'
      publishLocation: 'Container'
    displayName: 'Publish Xcode build log'

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: 'azure-screens'
      ArtifactName: 'afterstorm-simulator-screens'
      publishLocation: 'Container'
    displayName: 'Publish AfterStorm simulator screens and diagnostics'
