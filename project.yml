name: AfterStorm
options:
  bundleIdPrefix: com.stormandme
  deploymentTarget:
    iOS: "18.0"
packages:
  AfterStormCore:
    path: .
targets:
  AfterStorm:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AfterStormApp
      - path: Shared
    dependencies:
      - package: AfterStormCore
        product: AfterStormCore
      - target: AfterStormWidget
        embed: true
        codeSign: false
    entitlements:
      path: AfterStormApp/AfterStorm.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stormandme.afterstorm
        PRODUCT_NAME: AfterStorm
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AfterStorm
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "AfterStorm uses the camera only when you choose Scan My World to turn the current scene into small quests."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "AfterStorm uses the microphone only when you choose to speak a quest request."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "AfterStorm can transcribe your spoken request into text so it can suggest a small quest."
  AfterStormWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AfterStormWidget
      - path: Shared
    dependencies:
      - package: AfterStormCore
        product: AfterStormCore
    entitlements:
      path: AfterStormWidget/AfterStormWidget.entitlements
    info:
      path: AfterStormWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stormandme.afterstorm.widget
        PRODUCT_NAME: AfterStormWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
